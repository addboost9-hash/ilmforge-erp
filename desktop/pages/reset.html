<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Reset a password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main">
    <header>
      <h2>Reset a password</h2>
      <p>For someone who forgot their password. No internet or emailed code is needed: this is the school's own computer.</p>
    </header>
    <form class="panel" id="form" novalidate>
      <div class="field">
        <label for="user">Whose password</label>
        <select id="user" class="select"></select>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" autocomplete="new-password">
          <div class="hint">At least 8 characters.</div>
        </div>
        <div class="field">
          <label for="confirm">New password again</label>
          <input type="password" id="confirm" autocomplete="new-password">
        </div>
      </div>
      <div class="note" id="msg" hidden></div>
      <div class="row">
        <button class="btn" type="submit" id="save">Save the new password</button>
        <span class="grow"></span>
        <button class="link" type="button" id="close">Close</button>
      </div>
    </form>
    <p class="sub">Teachers, parents and students can also be given a new password by an admin inside IlmForge, in Portal Management.</p>
  </main>
  <script src="reset.js"></script>
</body>
</html>
